[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picr_ma"
version = "0.1.0"
description = "PICR-MA small-compute reproducible MARL experiments"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.2",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pettingzoo>=1.24",
  "pygame>=2.6",
  "pyyaml>=6.0",
  "supersuit>=3.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
